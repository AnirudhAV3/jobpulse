name: Deploy JobPulse to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Netlify deploy credential
        id: auth
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped. Add NETLIFY_AUTH_TOKEN to repository Actions secrets to enable automatic deploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.auth.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.auth.outputs.configured == 'true'
      - name: Build and deploy production site
        run: npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID"
        if: steps.auth.outputs.configured == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 488e8983-bb2e-437d-9d06-d66ba4cc7b5c
